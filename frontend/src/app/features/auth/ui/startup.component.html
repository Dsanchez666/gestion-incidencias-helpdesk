<section class="startup-layout">
  <article class="startup-card">
    <h1>Autenticación MFA</h1>
    <p>{{ statusMessage }}</p>
    <div class="status" [class.error]="hasError">
      <span class="dot"></span>
      <span>{{ hasError ? 'Error de autenticación' : 'Proceso automático en curso' }}</span>
    </div>
  </article>
</section>
