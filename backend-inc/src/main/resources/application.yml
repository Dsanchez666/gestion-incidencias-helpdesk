server:
  port: 4000
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/GestionIncidencias?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:GestorIncidencias}
    password: ${DB_PASS:}
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
app:
  notifications:
    from: no-reply@gestion-incidencias.local
  

spring.servlet:
  multipart:
    max-file-size: 5MB
    max-request-size: 5MB
